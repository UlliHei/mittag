name: Test Blockhouse Parsing

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Block-House-Seite abrufen
        run: |
          curl -L "https://www.block-house.de/speisekarte/lunch-time/" -o blockhouse.html

      - name: Tagesgerichte strukturieren
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          import re
          import json

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.text = []

              def handle_data(self, data):
                  data = data.strip()
                  if data:
                      self.text.append(data)

          with open("blockhouse.html", "r", encoding="utf-8") as f:
              html = f.read()

          parser = TextParser()
          parser.feed(html)

          lines = parser.text

          start = None
          end = None

          for i, line in enumerate(lines):
              if "Aktuelle Lunch Time Gerichte" in line:
                  start = i
              if "jetzt tisch reservieren" in line.lower():
                  end = i
                  break

          if start is None:
              print("Start nicht gefunden")
              exit(1)

          if end is None:
              end = len(lines)

          lunch_lines = lines[start:end]

          weekday_pattern = re.compile(r"^(Montag|Dienstag|Mittwoch|Donnerstag|Freitag)\s*\|\s*(\d{2}\.\d{2}\.\d{4})$")

          items = []

          for i, line in enumerate(lunch_lines):
              match = weekday_pattern.match(line)

              if match:
                  weekday = match.group(1)
                  date = match.group(2)

                  name = lunch_lines[i + 1] if i + 1 < len(lunch_lines) else ""
                  description = lunch_lines[i + 2] if i + 2 < len(lunch_lines) else ""
                  price = lunch_lines[i + 3] if i + 3 < len(lunch_lines) else ""

                  if "€" in price:
                      items.append({
                          "category": weekday,
                          "date": date,
                          "name": name,
                          "description": description,
                          "price": price
                      })

          print(json.dumps(items, ensure_ascii=False, indent=2))
          PY
