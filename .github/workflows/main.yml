name: Test Blockhouse Parsing

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Block-House-Seite abrufen
        run: |
          curl -L "https://www.block-house.de/speisekarte/lunch-time/" -o blockhouse.html

      - name: Relevanten Lunch-Time-Bereich anzeigen
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.text = []

              def handle_data(self, data):
                  data = data.strip()
                  if data:
                      self.text.append(data)

          with open("blockhouse.html", "r", encoding="utf-8") as f:
              html = f.read()

          parser = TextParser()
          parser.feed(html)

          lines = parser.text

          start = None
          end = None

          for i, line in enumerate(lines):
              if "Aktuelle Lunch Time Gerichte" in line:
                  start = i
              if "jetzt tisch reservieren" in line.lower():
                  end = i
                  break

          if start is None:
              print("Start nicht gefunden")
              exit(1)

          if end is None:
              end = len(lines)

          lunch_lines = lines[start:end]

          for line in lunch_lines:
              print(line)
          PY
