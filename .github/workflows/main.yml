name: Update Blockhouse JSON

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Block-House-Seite abrufen
        run: |
          curl -L "https://www.block-house.de/speisekarte/lunch-time/" -o blockhouse.html

      - name: JSON erzeugen
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          import re
          import json

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.text = []

              def handle_data(self, data):
                  data = data.strip()
                  if data:
                      self.text.append(data)

          with open("blockhouse.html", "r", encoding="utf-8") as f:
              html = f.read()

          parser = TextParser()
          parser.feed(html)

          lines = parser.text

          start = None
          end = None

          for i, line in enumerate(lines):
              if "Aktuelle Lunch Time Gerichte" in line:
                  start = i
              if "jetzt tisch reservieren" in line.lower():
                  end = i
                  break

          if start is None:
              print("Start nicht gefunden")
              exit(1)

          if end is None:
              end = len(lines)

          lunch_lines = lines[start:end]

          weekday_pattern = re.compile(r"^(Montag|Dienstag|Mittwoch|Donnerstag|Freitag)\s*\|\s*(\d{2}\.\d{2}\.\d{4})$")

          items = []
          i = 0

          while i < len(lunch_lines):
              line = lunch_lines[i]

              match = weekday_pattern.match(line)
              if match:
                  weekday = match.group(1)
                  date = match.group(2)

                  name = lunch_lines[i + 1]
                  description = lunch_lines[i + 2]
                  price = lunch_lines[i + 3]

                  if "€" in price:
                      items.append({
                          "category": weekday,
                          "date": date,
                          "name": name,
                          "description": description,
                          "price": price
                      })
                  i += 4
                  continue

              if line == "Wochen-Highlights":
                  i += 1
                  continue

              if line.startswith("Vom "):
                  date = line.replace("Vom ", "")

                  name = lunch_lines[i + 1]
                  description = lunch_lines[i + 2]
                  price = lunch_lines[i + 3]

                  if "€" in price:
                      items.append({
                          "category": "Wochen-Highlight",
                          "date": date,
                          "name": name,
                          "description": description,
                          "price": price
                      })
                  i += 4
                  continue

              i += 1

          with open("blockhouse.json", "w", encoding="utf-8") as f:
              json.dump({"items": items}, f, ensure_ascii=False, indent=2)

          print("blockhouse.json erstellt")
          PY

      - name: Datei committen
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add blockhouse.json
          git commit -m "update blockhouse.json" || echo "nichts zu committen"
          git push
