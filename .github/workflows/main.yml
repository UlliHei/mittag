name: Test Blockhouse Parsing

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Block-House-Seite abrufen
        run: |
          curl -L "https://www.block-house.de/speisekarte/lunch-time/" -o blockhouse.html

      - name: Gerichte extrahieren (einfacher Versuch)
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.text = []

              def handle_data(self, data):
                  data = data.strip()
                  if data:
                      self.text.append(data)

          with open("blockhouse.html", "r", encoding="utf-8") as f:
              html = f.read()

          parser = TextParser()
          parser.feed(html)

          lines = parser.text

          for i, line in enumerate(lines):
              if "€" in line:
                  name = lines[i-1] if i > 0 else ""
                  print(f"{name} -> {line}")
          PY
