name: Update Blockhouse JSON

on:
  workflow_dispatch:

permissions:
    contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v3

      - name: blockhouse.json erstellen
        run: |
          echo '{
            "items": [
              { "category": "Heute", "name": "Testgericht", "price": "10,00 €" }
            ]
          }' > blockhouse.json

      - name: Datei committen
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add blockhouse.json
          git commit -m "update blockhouse.json" || echo "nichts zu committen"
          git push
