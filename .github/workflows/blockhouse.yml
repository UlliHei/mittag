name: Update Blockhouse JSON

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"
    - cron: "30 5 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Block-House-Seite abrufen
        run: |
          curl -L "https://www.block-house.de/speisekarte/lunch-time/" -o blockhouse.html

      - name: JSON erzeugen
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          import re
          import json

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.text = []

              def handle_data(self, data):
                  data = data.strip()
                  if data:
                      self.text.append(data)

          with open("blockhouse.html", "r", encoding="utf-8") as f:
              html = f.read()

          parser = TextParser()
          parser.feed(html)

          lines = parser.text

          start = None
          end = None

          for i, line in enumerate(lines):
              if "Aktuelle Lunch Time Gerichte" in line:
                  start = i
              if "jetzt tisch reservieren" in line.lower():
                  end = i
                  break

          if start is None:
              print("Start nicht gefunden")
              exit(1)

          if end is None:
              end = len(lines)

          lunch_lines = lines[start:end]

          weekday_pattern = re.compile(
              r"^(Montag|Dienstag|Mittwoch|Donnerstag|Freitag)\s*\|\s*(\d{2}\.\d{2}\.\d{4})$"
          )

          def is_price(text):
              return "€" in text

          items = []
          i = 0

          while i < len(lunch_lines):
              line = lunch_lines[i]

              match = weekday_pattern.match(line)

              if match:
                  weekday = match.group(1)
                  date = match.group(2)

                  j = i + 1
                  block = []

                  while j < len(lunch_lines):
                      next_line = lunch_lines[j]

                      if weekday_pattern.match(next_line):
                          break

                      if next_line == "Wochen-Highlights":
                          break

                      if next_line.startswith("Vom "):
                          break

                      block.append(next_line)
                      j += 1

                  price_index = None

                  for k, value in enumerate(block):
                      if is_price(value):
                          price_index = k
                          break

                  if price_index is not None and price_index >= 1:
                      name = block[0]
                      description = " ".join(block[1:price_index]).strip()
                      price = block[price_index]

                      items.append({
                          "category": weekday,
                          "date": date,
                          "name": name,
                          "description": description,
                          "price": price
                      })

                  i = j
                  continue

              if line == "Wochen-Highlights":
                  i += 1
                  continue

              if line.startswith("Vom "):
                  date = line.replace("Vom ", "")

                  j = i + 1
                  block = []

                  while j < len(lunch_lines):
                      next_line = lunch_lines[j]

                      if weekday_pattern.match(next_line):
                          break

                      if next_line.startswith("Vom "):
                          break

                      block.append(next_line)
                      j += 1

                  price_index = None

                  for k, value in enumerate(block):
                      if is_price(value):
                          price_index = k
                          break

                  if price_index is not None and price_index >= 1:
                      name = block[0]
                      description = " ".join(block[1:price_index]).strip()
                      price = block[price_index]

                      items.append({
                          "category": "Wochen-Highlight",
                          "date": date,
                          "name": name,
                          "description": description,
                          "price": price
                      })

                  i = j
                  continue

              i += 1

          with open("blockhouse.json", "w", encoding="utf-8") as f:
              json.dump({"items": items}, f, ensure_ascii=False, indent=2)

          print("blockhouse.json erstellt")
          print(json.dumps({"items": items}, ensure_ascii=False, indent=2))
          PY

      - name: Datei committen
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          rm -f blockhouse.html

          git add blockhouse.json
          git commit -m "update blockhouse.json" || echo "nichts zu committen"

          git pull --rebase
          git push
