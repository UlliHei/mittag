name: Update NDR JSON

on:
  workflow_dispatch:
  schedule:
    - cron: "5 5 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Repository laden
      - name: Repository auschecken
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      # NDR-Speiseplan abrufen
      - name: NDR-Seite abrufen
        run: |
          curl -L "https://www.ndr.de/speiseplan" -o ndr.html

      # NDR HTML prüfen
      - name: NDR HTML Debug
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser

          class DebugParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.text = []

              def handle_data(self, data):
                  text = data.strip()
                  if text:
                      self.text.append(text)

          with open("ndr.html", "r", encoding="utf-8") as f:
              html = f.read()

          parser = DebugParser()
          parser.feed(html)

          print("Gefundene Textzeilen:")
          print("---------------------")

          for i, line in enumerate(parser.text[:300]):
              print(i, repr(line))
          PY

      # JSON-Datei ins Repository schreiben
      - name: Datei committen
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add ndr.json
          git commit -m "update ndr.json" || echo "nichts zu committen"
          git push
