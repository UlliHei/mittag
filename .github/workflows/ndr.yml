name: Update NDR JSON

on:
  workflow_dispatch:
  schedule:
  - cron: "17 4 * * 1-6"
  - cron: "37 5 * * 1-6"
  - cron: "17 6 * * 1-6"
  - cron: "37 7 * * 1-6"
  - cron: "17 8 * * 1-6"
  - cron: "37 9 * * 1-6"
  - cron: "17 10 * * 1-6"
  - cron: "17 11 * * 1-6"
  - cron: "17 12 * * 1-6"
  - cron: "17 13 * * 1-6"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Repository laden
      - name: Repository auschecken
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      # NDR-Speiseplan abrufen
      - name: NDR-Seite abrufen
        run: |
          curl -L "https://www.ndr.de/speiseplan" -o ndr.html

      # HTML auslesen und ndr.json erzeugen
      - name: NDR JSON erzeugen
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          import json
          import re

          # Text aus der NDR-Seite sammeln
          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.text = []

              def handle_data(self, data):
                  text = data.strip()
                  if text:
                      self.text.append(text)

          # Prüft, ob eine Zeile ein Preis ist, z. B. 5,90
          def is_price(text):
              return re.match(r"^\d{1,2},\d{2}$", text) is not None

          # Prüft bekannte Kategorien im NDR-Speiseplan
          def is_category(text):
              return text in {
                  "Vorspann",
                  "Studio 1",
                  "Studio 2",
                  "Studio 3",
                  '"Nordamerika"',
                  "Live Sendung",
                  "Sondersendung",
                  "Abspann"
              }

          # Kleine Fußnoten/Zusatzstoffnummern entfernen wir aus dem Gerichttext
          def is_note_number(text):
              return re.match(r"^[0-9]+[0-9a-zA-Z,]*$", text) is not None

          # Eine Gerichtzeile aus gesammelten Bestandteilen erzeugen
          def build_item(category, parts, price_ndr, price_external):
              info = ""

              # Zusatzinfo steht meistens direkt nach der Kategorie
              if parts and parts[0] in {"vegan", "vegetarisch"}:
                  info = parts[0]
                  parts = parts[1:]

              clean_parts = []

              for part in parts:
                  if is_note_number(part):
                      continue

                  clean_parts.append(part)

              name = " ".join(clean_parts).strip()
              name = re.sub(r"\s+", " ", name)
              
              # Kleine Leerzeichenfehler nach entfernten Fußnoten glätten
              name = name.replace(" ,", ",")
              name = name.replace("  ", " ")

              return {
                  "category": category,
                  "info": info,
                  "name": name,
                  "price_ndr": price_ndr,
                  "price_external": price_external
              }

          # HTML-Datei laden
          with open("ndr.html", "r", encoding="utf-8") as f:
              html = f.read()

          parser = TextParser()
          parser.feed(html)

          lines = parser.text

          result = {
              "source": "NDR Kasino Hamburg-Rothenbaum",
              "url": "https://www.ndr.de/speiseplan",
              "days": {}
          }

          day_pattern = re.compile(r"^(Montag|Dienstag|Mittwoch|Donnerstag|Freitag),\s*(\d{2}\.\d{2}\.\d{4})$")

          current_day = None
          current_date = ""
          current_category = None
          current_parts = []

          i = 0
          while i < len(lines):
              line = lines[i]

              # Neuen Tag erkennen
              day_match = day_pattern.match(line)
              if day_match:
                  current_day = day_match.group(1)
                  current_date = day_match.group(2)

                  result["days"][current_day] = {
                      "date": current_date,
                      "items": []
                  }

                  current_category = None
                  current_parts = []
                  i += 1
                  continue

              # Ende des Speiseplans erkennen
              if line.startswith("Spät- oder Wochenenddienst"):
                  break

              # Tabellenköpfe überspringen
              if line in {"Kategorie", "Zusatzinfo", "Speise", "Preis", "NDR", "Extern"}:
                  i += 1
                  continue

              # Kategorie erkennen
              if current_day and is_category(line):
                  current_category = line
                  current_parts = []
                  i += 1
                  continue

              # Preis-Paar erkennen: Preis NDR + Preis Extern
              if (
                  current_day
                  and current_category
                  and is_price(line)
                  and i + 1 < len(lines)
                  and is_price(lines[i + 1])
              ):
                  item = build_item(
                      current_category,
                      current_parts,
                      line,
                      lines[i + 1]
                  )

                  if item["name"]:
                      result["days"][current_day]["items"].append(item)

                  current_parts = []
                  current_category = None
                  i += 2
                  continue

              # Alles zwischen Kategorie und Preis gehört zum Gericht
              if current_day and current_category:
                  current_parts.append(line)

              i += 1

          # JSON speichern
          with open("ndr.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print("ndr.json erstellt")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      # JSON-Datei ins Repository schreiben
      - name: Datei committen
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          rm -f ndr.html

          git add ndr.json
          git commit -m "update ndr.json" || echo "nichts zu committen"

          git pull --rebase
          git push
