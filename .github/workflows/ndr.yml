name: Update NDR JSON

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1-6"
    - cron: "37 3 * * 1-6"
    - cron: "17 4 * * 1-6"
    - cron: "37 4 * * 1-6"
    - cron: "17 5 * * 1-6"
    - cron: "37 5 * * 1-6"
    - cron: "17 6 * * 1-6"
    - cron: "17 7 * * 1-6"
    - cron: "17 8 * * 1-6"
    - cron: "17 9 * * 1-6"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: NDR-Seite abrufen
        run: |
          curl -L "https://www.ndr.de/speiseplan" -o ndr.html

      - name: NDR JSON erzeugen
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          import json
          import re

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.text = []

              def handle_data(self, data):
                  text = data.strip()
                  if text:
                      self.text.append(text)

          def is_price(text):
              return re.match(r"^\d{1,2},\d{2}$", text) is not None

          def is_note_number(text):
              return re.match(r"^[0-9]+[0-9a-zA-Z,]*$", text) is not None

          def looks_like_info(text):
              lower = text.lower()
              return any(word in lower for word in [
                  "vegan",
                  "vegetarisch",
                  "gluten",
                  "lactose",
                  "laktose"
              ])

          def clean_text(text):
              text = text.strip()
              text = re.sub(r"\s+", " ", text)
              text = text.replace(" ,", ",")
              return text

          def build_item_from_row(row_parts, price_ndr, price_external):
              if not row_parts:
                  return None

              category = clean_text(row_parts[0])
              rest = row_parts[1:]

              info = ""
              if rest and looks_like_info(rest[0]):
                  info = clean_text(rest[0])
                  rest = rest[1:]

              name_parts = []

              for part in rest:
                  part = clean_text(part)

                  if not part:
                      continue

                  if is_note_number(part):
                      continue

                  name_parts.append(part)

              name = clean_text(" ".join(name_parts))

              if not category or not name:
                  return None

              return {
                  "category": category,
                  "info": info,
                  "name": name,
                  "price_ndr": price_ndr,
                  "price_external": price_external
              }

          with open("ndr.html", "r", encoding="utf-8") as f:
              html = f.read()

          parser = TextParser()
          parser.feed(html)

          lines = parser.text

          result = {
              "source": "NDR Kasino Hamburg-Rothenbaum",
              "url": "https://www.ndr.de/speiseplan",
              "days": {}
          }

          day_pattern = re.compile(r"^(Montag|Dienstag|Mittwoch|Donnerstag|Freitag),\s*(\d{2}\.\d{2}\.\d{4})$")

          current_day = None
          current_date = ""
          current_row = []

          i = 0
          while i < len(lines):
              line = clean_text(lines[i])

              day_match = day_pattern.match(line)
              if day_match:
                  current_day = day_match.group(1)
                  current_date = day_match.group(2)

                  result["days"][current_day] = {
                      "date": current_date,
                      "items": []
                  }

                  current_row = []
                  i += 1
                  continue

              if line.startswith("Spät- oder Wochenenddienst"):
                  break

              if line in {"Kategorie", "Zusatzinfo", "Speise", "Preis", "NDR", "Extern"}:
                  i += 1
                  continue

              if (
                  current_day
                  and is_price(line)
                  and i + 1 < len(lines)
                  and is_price(clean_text(lines[i + 1]))
              ):
                  item = build_item_from_row(
                      current_row,
                      line,
                      clean_text(lines[i + 1])
                  )

                  if item:
                      result["days"][current_day]["items"].append(item)

                  current_row = []
                  i += 2
                  continue

              if current_day:
                  current_row.append(line)

              i += 1

          with open("ndr.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print("ndr.json erstellt")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Datei committen
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          rm -f ndr.html

          git add ndr.json
          git commit -m "update ndr.json" || echo "nichts zu committen"

          git pull --rebase
          git push
